<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1360" width="1100" height="1360" role="img" aria-labelledby="ttl dsc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="ttl">Resilient event-driven consumer architecture</title>
<desc id="dsc">A Kafka topic with 10 partitions feeds a consumer group of 6 pods, which enqueue into 20 Redis-backed queues (10 partitions by 2 regions). Partition-isolated worker pools guarded by 20 circuit breakers call the regional downstream service. Four defence layers are highlighted: bounded intake, durable offload, backpressure via partition pause, and circuit breaking.</desc>
<style>
  svg{--ink:#1e293b;--muted:#64748b;--line:#cbd5e1;--line-strong:#94a3b8;--surface:#ffffff;--panel:#f8fafc;--chip:#f1f5f9;--accent:#b45309;--accent-line:#d97706;--accent-bg:#fef3c7;}
  @media (prefers-color-scheme: dark){svg{--ink:#e2e8f0;--muted:#94a3b8;--line:#334155;--line-strong:#475569;--surface:#0f172a;--panel:#131c2e;--chip:#1e293b;--accent:#fbbf24;--accent-line:#d97706;--accent-bg:#3b2f14;}}
  .panel{fill:var(--panel);stroke:var(--line);stroke-width:1.25;}
  .box{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.25;}
  .chip{fill:var(--chip);stroke:var(--line);stroke-width:1;}
  .acc{fill:var(--accent-bg);stroke:var(--accent-line);stroke-width:1.25;}
  .h{fill:var(--ink);font-size:15px;font-weight:650;}
  .sub{fill:var(--muted);font-size:11.5px;}
  .lbl{fill:var(--ink);font-size:12.5px;font-weight:600;}
  .sm{fill:var(--ink);font-size:11px;}
  .mono{fill:var(--muted);font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .note{fill:var(--muted);font-size:11.5px;}
  .accT{fill:var(--accent);font-size:11.5px;font-weight:650;}
  .edge{stroke:var(--line-strong);stroke-width:1.5;fill:none;}
  .edgeA{stroke:var(--accent-line);stroke-width:1.75;fill:none;stroke-dasharray:6 4;}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line-strong)"/></marker>
  <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-line)"/></marker>
