  <rect x="702" y="206" width="272" height="60" rx="6" class="box"/><text x="716" y="230" class="lbl">Pod 3</text><text x="716" y="250" class="mono">P5, P6</text>
  <rect x="126" y="278" width="272" height="60" rx="6" class="box"/><text x="140" y="302" class="lbl">Pod 4</text><text x="140" y="322" class="mono">P7, P8</text>
  <rect x="414" y="278" width="272" height="60" rx="6" class="box"/><text x="428" y="302" class="lbl">Pod 5</text><text x="428" y="322" class="mono">P9</text>
  <rect x="702" y="278" width="272" height="60" rx="6" class="box"/><text x="716" y="302" class="lbl">Pod 6</text><text x="716" y="322" class="mono">P10</text>
</g>
