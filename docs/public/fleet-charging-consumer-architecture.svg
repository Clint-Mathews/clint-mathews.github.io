  <rect x="126" y="478" width="164" height="30" rx="5" class="chip"/><text x="208" y="497">p1-eu-queue</text>
  <rect x="305" y="478" width="164" height="30" rx="5" class="chip"/><text x="387" y="497">p2-eu-queue</text>
