<path d="M110,500 L58,500 L58,82 L106,82" class="edgeA" marker-end="url(#aA)"/>

<rect x="110" y="668" width="880" height="306" rx="8" class="panel"/>
<text x="126" y="692" class="lbl">Partition-isolated worker pools</text>
<text x="330" y="692" class="sub">140 workers · 10 US + 4 EU per partition</text>
<g>
  <rect x="126" y="704" width="272" height="122" rx="6" class="box"/><text x="140" y="726" class="lbl">Pod 1 workers</text><text x="140" y="744" class="mono">P1, P2 queues</text><text x="140" y="764" class="sm">US 10 + 10   ·   EU 4 + 4</text><rect x="140" y="776" width="244" height="34" rx="5" class="acc"/><text x="152" y="798" class="accT">4 circuit breakers</text>
  <rect x="414" y="704" width="272" height="122" rx="6" class="box"/><text x="428" y="726" class="lbl">Pod 2 workers</text><text x="428" y="744" class="mono">P3, P4 queues</text><text x="428" y="764" class="sm">US 10 + 10   ·   EU 4 + 4</text><rect x="428" y="776" width="244" height="34" rx="5" class="acc"/><text x="440" y="798" class="accT">4 circuit breakers</text>
  <rect x="702" y="704" width="272" height="122" rx="6" class="box"/><text x="716" y="726" class="lbl">Pod 3 workers</text><text x="716" y="744" class="mono">P5, P6 queues</text><text x="716" y="764" class="sm">US 10 + 10   ·   EU 4 + 4</text><rect x="716" y="776" width="244" height="34" rx="5" class="acc"/><text x="728" y="798" class="accT">4 circuit breakers</text>
  <rect x="126" y="840" width="272" height="122" rx="6" class="box"/><text x="140" y="862" class="lbl">Pod 4 workers</text><text x="140" y="880" class="mono">P7, P8 queues</text><text x="140" y="900" class="sm">US 10 + 10   ·   EU 4 + 4</text><rect x="140" y="912" width="244" height="34" rx="5" class="acc"/><text x="152" y="934" class="accT">4 circuit breakers</text>
  <rect x="414" y="840" width="272" height="122" rx="6" class="box"/><text x="428" y="862" class="lbl">Pod 5 workers</text><text x="428" y="880" class="mono">P9 queues</text><text x="428" y="900" class="sm">US 10   ·   EU 4</text><rect x="428" y="912" width="244" height="34" rx="5" class="acc"/><text x="440" y="934" class="accT">2 circuit breakers</text>
  <rect x="702" y="840" width="272" height="122" rx="6" class="box"/><text x="716" y="862" class="lbl">Pod 6 workers</text><text x="716" y="880" class="mono">P10 queues</text><text x="716" y="900" class="sm">US 10   ·   EU 4</text><rect x="716" y="912" width="244" height="34" rx="5" class="acc"/><text x="728" y="934" class="accT">2 circuit breakers</text>
</g>
<path d="M420,974 L300,1012" class="edge" marker-end="url(#a)"/>
<path d="M680,974 L800,1012" class="edge" marker-end="url(#a)"/>

<rect x="110" y="1018" width="380" height="66" rx="8" class="box"/>
<text x="130" y="1046" class="lbl">US charging management</text><text x="130" y="1068" class="sub">regional service · load balanced</text>
<rect x="610" y="1018" width="380" height="66" rx="8" class="box"/>
<text x="630" y="1046" class="lbl">EU charging management</text><text x="630" y="1068" class="sub">regional service · load balanced</text>

<g>
  <circle cx="1032" cy="240" r="13" class="acc"/><text x="1032" y="245" class="accT" text-anchor="middle">1</text><text x="1052" y="237" class="accT">Bounded</text><text x="1052" y="251" class="accT">intake</text>
  <circle cx="1032" cy="500" r="13" class="acc"/><text x="1032" y="505" class="accT" text-anchor="middle">2</text><text x="1052" y="497" class="accT">Durable</text><text x="1052" y="511" class="accT">offload</text>
  <circle cx="58" cy="300" r="13" class="acc"/><text x="58" y="305" class="accT" text-anchor="middle">3</text><text x="20" y="336" class="accT">Pause at</text><text x="20" y="350" class="accT">80% depth</text>
  <circle cx="1032" cy="810" r="13" class="acc"/><text x="1032" y="815" class="accT" text-anchor="middle">4</text><text x="1052" y="807" class="accT">Circuit</text><text x="1052" y="821" class="accT">breaking</text>
</g>

<line x1="110" y1="1120" x2="990" y2="1120" stroke="var(--line)" stroke-width="1"/>
<text x="110" y="1146" class="note"><tspan class="accT">Four defence layers.</tspan> Each one fails into the next, so a downstream outage degrades throughput instead of killing pods.</text>
<text x="110" y="1168" class="note">1 · Batch poll with sequential enqueue bounds in-flight work.   2 · Redis holds the message before the Kafka offset moves.</text>
<text x="110" y="1190" class="note">3 · Queue depth at 80% pauses the Kafka partition.   4 · One breaker per partition-region stops retry amplification at the source.</text>
<text x="110" y="1224" class="note">Non-goals: exactly-once semantics (duplicates &lt;0.1%, jobs idempotent) · strict cross-partition ordering · cross-region routing.</text>
<text x="110" y="1246" class="note">Known cost: pause granularity is per Kafka partition, so a saturated queue in one region also delays the other on that partition.</text>
<text x="110" y="1280" class="mono">Resilient event-driven consumer · design under review</text>
</svg>
