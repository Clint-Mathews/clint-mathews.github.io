  <rect x="842" y="478" width="164" height="30" rx="5" class="chip"/><text x="924" y="497">p5-eu-queue</text>
  <rect x="126" y="516" width="164" height="30" rx="5" class="chip"/><text x="208" y="535">p6-us-queue</text>
  <rect x="305" y="516" width="164" height="30" rx="5" class="chip"/><text x="387" y="535">p7-us-queue</text>
  <rect x="484" y="516" width="164" height="30" rx="5" class="chip"/><text x="566" y="535">p8-us-queue</text>
  <rect x="663" y="516" width="164" height="30" rx="5" class="chip"/><text x="745" y="535">p9-us-queue</text>
  <rect x="842" y="516" width="164" height="30" rx="5" class="chip"/><text x="924" y="535">p10-us-queue</text>
  <rect x="126" y="554" width="164" height="30" rx="5" class="chip"/><text x="208" y="573">p6-eu-queue</text>
  <rect x="305" y="554" width="164" height="30" rx="5" class="chip"/><text x="387" y="573">p7-eu-queue</text>
  <rect x="484" y="554" width="164" height="30" rx="5" class="chip"/><text x="566" y="573">p8-eu-queue</text>
  <rect x="663" y="554" width="164" height="30" rx="5" class="chip"/><text x="745" y="573">p9-eu-queue</text>
  <rect x="842" y="554" width="164" height="30" rx="5" class="chip"/><text x="924" y="573">p10-eu-queue</text>
</g>
<text x="126" y="605" class="mono">jobId = partition + offset (idempotent)   ·   offsets commit only after successful enqueue</text>
