<text x="126" y="428" class="lbl">Redis queues</text>
<text x="234" y="428" class="sub">20 queues — 10 partitions × 2 regions · durability boundary</text>
<g class="mono" text-anchor="middle">
  <rect x="126" y="440" width="164" height="30" rx="5" class="chip"/><text x="208" y="459">p1-us-queue</text>
  <rect x="305" y="440" width="164" height="30" rx="5" class="chip"/><text x="387" y="459">p2-us-queue</text>
  <rect x="484" y="440" width="164" height="30" rx="5" class="chip"/><text x="566" y="459">p3-us-queue</text>
